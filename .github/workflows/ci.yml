name: Doc Anchor AI - CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Cài thêm thư viện test cơ bản
          pip install pytest flake8

      - name: 🔍 Linting (Kiểm tra cú pháp cơ bản)
        run: |
          # Dừng build nếu có lỗi cú pháp Python (syntax errors hoặc undefined names)
          flake8 src/ingestion --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 🧪 Verify Architecture Imports (Kiểm tra cấu trúc file mới)
        run: |
          # Đảm bảo toàn bộ cấu trúc thư mục mới (core, tables, extractors) không bị lỗi Import
          python -c "from src.ingestion.pipeline import IngestionPipeline; print('Import Pipeline OK!')"
          python -c "from src.ingestion.core.image_preprocessor import ImagePreprocessor; print('Import ImagePreprocessor OK!')"
          python -c "from src.ingestion.extractors.paddle_ocr_extractor import PaddleOCRExtractor; print('Import PaddleOCRExtractor OK!')"
          python -c "from src.ingestion.tables.table_region_detection import TableRegionDetector; print('Import TableRegionDetector OK!')"

      - name: ⚠️ Note about Full Pipeline Test
        run: |
          echo "Bỏ qua chạy Full Pipeline (test_run.py) vì GitHub Actions (2 Core, 7GB RAM) không đủ cấu hình tải Ollama Server và model Qwen2.5-VL 7B."
