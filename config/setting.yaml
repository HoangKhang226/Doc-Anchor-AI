app:
  project_name: "Doc Anchor AI"
  version: "1.0.0"
  debug: true

llm:
  ollama:
    base_url: "http://localhost:11434"
    model: "qwen2.5:7b"
    vlm_model: "qwen2.5vl:7b"
    embed_model: "nomic-embed-text"

storage:
  # DATA
  data:
    data_dir: "data"
    raw_dir: "data/raw"
    processed_dir: "data/processed"

# OBSERVABILITY
langsmith:
  enabled: false
  project: "finsight_ai_monitor"
  endpoint: "https://api.smith.langchain.com"
