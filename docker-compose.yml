version: '3.8'

services:
  backend:
    build: .
    container_name: doc-anchor-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      # Giả định Ollama (Qwen2.5-VL) đang chạy trực tiếp trên máy chủ thật (VPS Host)
      - OLLAMA_HOST=http://host.docker.internal:11434
    restart: unless-stopped

  frontend:
    build: .
    container_name: doc-anchor-frontend
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - backend
    restart: unless-stopped
